# 人工补充数据：每次爬取后自动合并，再统一进入 staging、确认和数据库写入。
# 同名记录只覆盖明确填写的字段；未填写的字段保持 Wiki/已有记录的值。
# null 或 "" 显式清空字段，0 是真实数值。名称要与 Wiki 完全一致（包含括号后缀）。
# 编号、ID 和 yes/no 建议加引号，避免 YAML 自动类型转换。
# 示例均为虚构且已注释，不会写入数据库；使用时删掉对应分类的 [] 并取消示例注释。
# 图片路径相对于 data/，需人工放置文件；不会根据人工数据自动下载图片。
