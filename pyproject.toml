[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrc-battle-lab"
version = "0.1.0"
description = "纯核心战斗模拟器与半自动对战数据审计工具"
requires-python = ">=3.10"
dependencies = [
    "pypinyin>=0.50",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "numpy>=1.24",
    "beautifulsoup4>=4.12",
    "cryptography>=41",
]

[project.optional-dependencies]
wiki = ["PyYAML>=6,<7"]
screen = [
    "mss>=10.2,<11",
    "opencv-python-headless>=4.8",
    "pydantic>=2.7,<3",
    "rapidocr==3.10.0",
    "onnxruntime>=1.17,<2",
    "PyYAML>=6,<7",
    "starlette",
    "pywin32>=306; sys_platform == 'win32'",
    "capturekit==0.1.0; sys_platform == 'win32'",
]
training = ["torch>=2.0"]
segmentation = [
    "torch>=2.0",
    "torchvision>=0.15",
    "Pillow>=9.0",
]
dev = ["pytest>=8.0", "playwright>=1.64.1"]

[tool.setuptools.packages.find]
include = ["nrc_ai", "nrc_ai.*", "nrc_core", "nrc_core.*", "nrc_platform", "nrc_platform.*", "nrc_server", "nrc_server.*", "wiki_crawler", "wiki_crawler.*"]
namespaces = false

[tool.setuptools.package-data]
nrc_server = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
