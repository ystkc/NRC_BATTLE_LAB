[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrc-battle-lab"
version = "0.1.0"
description = "纯核心战斗模拟器与半自动对战数据审计工具"
requires-python = ">=3.10"
dependencies = ["pypinyin>=0.50", "fastapi>=0.115", "uvicorn>=0.30", "numpy>=1.24", "beautifulsoup4>=4.12", "cryptography>=41"]

[project.optional-dependencies]
wiki = ["PyYAML>=6.0"]
screen = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "mss>=9.0",
    "rapidocr>=3.0",
    "onnxruntime>=1.17",
]
training = [
    "numpy>=1.24",
    "torch>=2.0",
]
segmentation = [
    "torch>=2.0",
    "torchvision>=0.15",
    "Pillow>=9.0",
]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
